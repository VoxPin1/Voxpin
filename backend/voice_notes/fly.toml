app = "voxpin-helper"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  VOXPIN_TZ = "America/Los_Angeles"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "8s"
    grace_period = "45s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
